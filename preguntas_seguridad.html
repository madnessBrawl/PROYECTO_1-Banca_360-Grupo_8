<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <title>Seguridad - Banco El Rey Seguro</title>
    <link rel="stylesheet" href="estilos.css" />
    <link rel="stylesheet" href="estilos_preguntas_seguridad.css" />
</head>
<body>
    <header class="marco-superior">
        <div class="contenedor"> 
            <div class="logo">
                <img src="imagenes/logo-bancoElRey.png" alt="Logo del Banco" width="100" height="100"/>
                <span>Banco El Rey Seguro</span> 
            </div>
            <nav>
                <ul>
                    <li><button id="boton-claro-oscuro" class="btn-modo">MODO OSCURO</button></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="contenedor">
        <div class="vista-actual">
            <h1>Seguridad de tu Cuenta</h1>
            <p id="instruccion">Responde 3 preguntas para proteger tu dinero.</p>
        </div>

        <div class="secciones-dinamicas">
            <form id="form-preguntas" onsubmit="event.preventDefault(); finalizarProceso();">
                <div class="grupo-entrada">
                    <label>Pregunta 1:</label><br>
                    <select id="p1-opcion" required>
                        <option value="">Selecciona...</option>
                        <option value="1">¿Nombre de tu primera mascota?</option>
                        <option value="2">¿Ciudad de nacimiento?</option>
                        <option value="3">¿Nombre de tu primera escuela?</option>
                    </select><br>
                    <input type="text" id="p1-respuesta" placeholder="Respuesta 1" required>
                </div>

                <div class="grupo-entrada">
                    <label>Pregunta 2:</label><br>
                    <select id="p2-opcion" required>
                        <option value="">Selecciona...</option>
                        <option value="4">¿Marca de tu primer teléfono?</option>
                        <option value="5">¿Nombre de tu madre o padre?</option>
                        <option value="6">¿Color favorito?</option>
                    </select><br>
                    <input type="text" id="p2-respuesta" placeholder="Respuesta 2" required>
                </div>

                <div class="grupo-entrada">
                    <label>Pregunta 3:</label><br>
                    <select id="p3-opcion" required>
                        <option value="">Selecciona...</option>
                        <option value="7">¿Comida favorita?</option>
                        <option value="8">¿Nombre de tu libro favorito?</option>
                        <option value="9">¿Película que más te gusta?</option>
                    </select><br>
                    <input type="text" id="p3-respuesta" placeholder="Respuesta 3" required>
                </div>

                <button type="submit">Finalizar Registro</button>
            </form>

            <div id="mensaje-exito" class="seccion-final">
                <h2>¡Registro Completado!</h2>
                <p>Tus preguntas de seguridad han sido guardadas. ¿Qué deseas hacer ahora?</p>
                <br>
                <div class="opciones-botones">
                    <button onclick="window.location.href='pagina_principal.html#iniciosesion'">Ir al Inicio de Sesión</button>
                    <button onclick="window.location.href='pagina_principal.html'">Ir a la Página Principal</button>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
